<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#f7f9f8">
  <title>Basket — Shopping list</title>
  <style>
    :root { color-scheme:light; --ink:#172925;--muted:#788781;--edge:#e6ece9;--paper:#f7f9f8;--green:#cafa78;--dark:#192e28;--white:#fff; --radius:21px; font-family:Roboto,"Arial",sans-serif; }
    *,*::before,*::after{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:var(--paper);color:var(--ink)}
    button,input{font:inherit}button{cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}
    button,a,input{-webkit-tap-highlight-color:transparent}
    button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #477d58;outline-offset:3px}
    .shell{width:min(100%,620px);margin:0 auto;padding:28px 22px calc(108px + env(safe-area-inset-bottom))}
    .topbar{display:flex;align-items:center;justify-content:space-between;margin:0 0 30px}
    .brand{display:flex;align-items:center;gap:11px;font-size:19px;font-weight:800;letter-spacing:-.8px}
    .logo{width:37px;height:37px;display:grid;place-items:center;background:var(--dark);color:var(--green);border-radius:13px}
    .date-tag{font-size:12px;letter-spacing:.03em;font-weight:700;color:#657770;background:#eef3f0;border:1px solid #e7eeea;padding:9px 12px;border-radius:30px}
    h1{font-size:clamp(30px,7vw,42px);line-height:1.08;letter-spacing:-1.7px;margin:0 0 11px;font-weight:800}
    .intro{margin:0 0 24px;font-size:14px;line-height:1.5;color:#76857e}
    .total-card{background:var(--dark);border-radius:24px;padding:27px 27px 24px;color:white;position:relative;overflow:hidden;min-height:176px}
    .total-card::before{content:"";width:250px;height:250px;border:1px solid rgba(202,250,120,.14);border-radius:50%;position:absolute;right:-120px;top:-165px;box-shadow:0 0 0 43px rgba(202,250,120,.025),0 0 0 85px rgba(202,250,120,.018);pointer-events:none}
    .total-eyebrow{color:#c2d4c9;font-size:12px;letter-spacing:.03em;font-weight:600}
    .total-value{font-size:clamp(35px,8vw,48px);font-weight:750;letter-spacing:-2px;line-height:1.22;margin-top:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .total-line{display:flex;align-items:center;gap:9px;margin-top:22px;font-size:12px;color:#cfdfd6}
    .total-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--green);flex:none}
    .total-line strong{color:var(--green);font-weight:750}
    .section-head{display:flex;justify-content:space-between;align-items:center;margin:33px 1px 17px}
    .section-title{font-size:19px;font-weight:750;letter-spacing:-.5px;margin:0}
    .section-count{font-size:12px;color:#687b73;font-weight:600}
    .toolbar{display:flex;gap:10px;align-items:center;margin-bottom:13px}
    .search{display:flex;align-items:center;gap:9px;flex:1;background:white;border:1px solid var(--edge);border-radius:14px;padding:0 14px;height:48px;min-width:0;color:#82928b}
    .search input{outline:none;border:0;background:transparent;width:100%;font-size:14px;color:var(--ink)}.search input::placeholder{color:#9aa9a2}
    .tabs{display:flex;gap:5px;padding:5px;background:#eaf0ed;border-radius:14px;margin-bottom:14px}
    .tab{flex:1;background:transparent;border:0;border-radius:10px;color:#71847b;height:35px;font-size:12px;font-weight:750}
    .tab.active{background:white;color:var(--ink);box-shadow:0 2px 8px #1c33230d}
    .items{display:flex;flex-direction:column;gap:10px}
    .item{background:#fff;border:1px solid var(--edge);border-radius:18px;min-height:100px;padding:12px;display:flex;align-items:center;gap:10px;box-shadow:0 3px 12px #17292505}
    .item.bought{background:#fcfdfc;opacity:.77}
    .check{height:24px;width:24px;border:1.6px solid #cddbd2;background:white;border-radius:8px;display:grid;place-items:center;color:transparent;flex-shrink:0;padding:0;transition:.12s}
    .check.checked{background:#325c43;border-color:#325c43;color:white}.check:hover{border-color:#57956d}
    .thumb{width:64px;height:67px;flex:none;border-radius:12px;background:#edf4ed;display:grid;place-items:center;color:#88a38c;overflow:hidden}
    .thumb img{width:100%;height:100%;object-fit:cover}.item-info{flex:1;min-width:0;align-self:center}
    .item-name{font-size:14px;font-weight:740;line-height:1.4;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
    .item.bought .item-name{text-decoration:line-through;color:#83938a}
    .item-sub{font-size:12px;color:#87968f;margin-top:6px}
    .item-right{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:8px;max-width:100px;flex:none}
    .price{font-size:15px;font-weight:800;letter-spacing:-.35px;white-space:nowrap}
    .icon-btn{border:0;background:transparent;color:#71877b;padding:4px;width:28px;height:28px;display:grid;place-items:center;border-radius:8px}
    .icon-btn:hover{background:#edf2ed}
    .right-actions{display:flex;gap:4px}
    .open-link{color:#2c7352;border:1px solid #cce6d7;background:#effaf2;padding:3px 6px;font-size:10px;line-height:1;font-weight:750;border-radius:7px;display:inline-flex;gap:3px;align-items:center;text-decoration:none}
    .open-link:hover{background:#dff1e5}
    .empty{padding:43px 22px 34px;text-align:center;border:1px dashed #d4dfd8;border-radius:20px;background:#fbfdfb}
    .empty-illustration{width:74px;height:74px;margin:0 auto 16px;border-radius:24px;background:#edf5e9;display:grid;place-items:center;color:#5c9568}
    .empty-title{font-size:17px;font-weight:750;margin:0 0 7px}.empty-desc{color:#87938c;font-size:13px;line-height:1.55;margin:0 auto;max-width:280px}
    .footer-note{margin:19px 0 0;text-align:center;font-size:11px;color:#97a59e}
    .bottom{position:fixed;bottom:0;left:0;right:0;background:linear-gradient(180deg,rgba(247,249,248,0),#f7f9f8 16%);padding:18px 22px calc(19px + env(safe-area-inset-bottom));z-index:10}
    .bottom-inner{width:min(100%,576px);margin:0 auto}.primary{height:54px;display:flex;align-items:center;justify-content:center;gap:9px;border:0;border-radius:15px;width:100%;background:var(--dark);color:#fff;font-size:14px;font-weight:750;box-shadow:0 10px 20px #1b342018}
    .primary:hover{background:#2b473d}.primary:active{transform:scale(.99)}
    dialog{border:0;padding:0;background:transparent;margin:auto;width:min(calc(100% - 20px),520px);max-height:min(93dvh,820px);color:var(--ink);overflow:visible}
    dialog::backdrop{background:#081a15a8;backdrop-filter:blur(4px)}
    .editor{background:white;border-radius:23px;padding:24px 22px 22px;max-height:93dvh;overflow-y:auto;overscroll-behavior:contain}
    .dialog-head{display:flex;justify-content:space-between;align-items:flex-start;margin:0 0 20px}.dialog-title{font-size:24px;letter-spacing:-.8px;margin:0;font-weight:800}.close-btn{background:#eff3f0;border:0;border-radius:12px;width:35px;height:35px;display:grid;place-items:center;color:#62756b}
    .editor-inner{display:grid;grid-template-columns:100px 1fr;gap:15px;align-items:center;margin-bottom:20px}
    .photo-upload{width:100px;height:100px;border:1.5px dashed #bfd2c5;border-radius:16px;background:#f1f7ef;color:#4c805c;display:flex;justify-content:center;align-items:center;flex-direction:column;gap:6px;font-size:11px;font-weight:700;position:relative;overflow:hidden;cursor:pointer;text-align:center;padding:5px}
    .photo-upload img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.photo-upload input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}
    .photo-note{font-size:12px;color:#8a9990;line-height:1.5}
    .field{display:flex;flex-direction:column;gap:7px;margin-bottom:16px}.field label{font-size:12px;color:#516960;font-weight:750}
    .field input{border:1px solid #dbe6de;border-radius:12px;padding:13px 13px;height:49px;outline:none;font-size:15px;background:#fcfdfc;color:var(--ink);width:100%}
    .field input:focus{border-color:#80b594;box-shadow:0 0 0 3px #93cda326}
    .dual{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,0.65fr);gap:11px}
    .form-error{min-height:18px;font-size:12px;color:#a93636;margin:0 0 8px}
    .form-bottom{display:flex;gap:10px;align-items:center;margin-top:4px}.secondary{height:52px;min-width:82px;border:1px solid #dce6df;background:white;color:#68796d;border-radius:13px;font-size:13px;font-weight:700;padding:0 17px}
    .save{flex:1;height:52px;border:0;background:var(--dark);color:white;border-radius:13px;font-size:14px;font-weight:750}
    .save:active{transform:scale(.99)}
    .delete{border:0;background:transparent;color:#ac5b5b;font-size:12px;font-weight:700;padding:12px 0 0}
    .toast{position:fixed;left:50%;bottom:105px;transform:translateX(-50%) translateY(18px);max-width:calc(100% - 44px);background:#243b32;color:white;border-radius:12px;padding:12px 16px;font-size:13px;text-align:center;opacity:0;transition:.18s;pointer-events:none;z-index:30;box-shadow:0 10px 35px #223e342c}
    .toast.visible{opacity:1;transform:translateX(-50%) translateY(0)}
    @media(min-width:680px){.shell{padding-top:42px}.bottom{position:static;background:none;padding:0 22px 36px}.bottom-inner{max-width:576px}.primary{box-shadow:none}dialog{max-height:90dvh}}
    @media(max-width:375px){.shell{padding:22px 14px 104px}.item{gap:7px;padding:10px}.thumb{width:55px;height:60px}.price{font-size:13px}.item-right{max-width:80px}.total-card{padding:24px}.item-name{font-size:13px}.bottom{padding-left:14px;padding-right:14px}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}}
  </style>
</head>
<body>
<div class="shell">
  <header class="topbar">
    <div class="brand"><div class="logo" aria-hidden="true"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><path d="m3 8 2 12h14l2-12H3Z"/><path d="M8 9V7a4 4 0 0 1 8 0v2"/></svg></div>Basket<span style="color:#8e9e94">.</span></div>
    <div class="date-tag">MY SHOPPING LIST</div>
  </header>
  <main>
    <h1>Shop smarter.</h1>
    <p class="intro">Keep everything you want to buy in one place.</p>
    <section class="total-card" aria-label="Shopping total">
      <div class="total-eyebrow">Estimated total</div>
      <div class="total-value" id="total" aria-live="polite">₹0</div>
      <div class="total-line"><span class="total-dot"></span><span><strong id="remaining">₹0</strong> left to purchase <span id="remaining-count"></span></span></div>
    </section>
    <div class="section-head"><h2 class="section-title">Your items</h2><div class="section-count" id="item-count">0 items</div></div>
    <div class="toolbar"><label class="search"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg><input type="search" id="search" aria-label="Search items" placeholder="Search your items..." autocomplete="off"></label></div>
    <nav class="tabs" aria-label="Item filters">
      <button class="tab active" type="button" data-filter="all" aria-pressed="true">All</button>
      <button class="tab" type="button" data-filter="pending" aria-pressed="false">To buy</button>
      <button class="tab" type="button" data-filter="bought" aria-pressed="false">Bought</button>
    </nav>
    <section class="items" id="items" aria-label="Shopping items"></section>
    <p class="footer-note">Your list is saved privately on this device.</p>
  </main>
</div>
<div class="bottom"><div class="bottom-inner"><button class="primary" type="button" id="add-btn"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg> Add item</button></div></div>
<dialog id="dialog" aria-labelledby="dialog-title"><form class="editor" id="item-form" novalidate>
  <header class="dialog-head"><h2 class="dialog-title" id="dialog-title">Add item</h2><button class="close-btn" type="button" id="close-dialog" aria-label="Close editor"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button></header>
  <div class="editor-inner"><label class="photo-upload" for="photo"><svg id="photo-icon" width="27" height="27" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg><span id="photo-label">Add photo</span><img id="photo-preview" alt="Selected item photo" hidden><input id="photo" type="file" accept="image/*" aria-label="Choose item photo"></label><div class="photo-note">Make your list easier to recognise.<br><br>Choose a photo from your phone (optional).</div></div>
  <div class="field"><label for="name">Item name</label><input id="name" type="text" maxlength="120" placeholder="e.g. Wireless headphones" required autocomplete="off"></div>
  <div class="dual"><div class="field"><label for="price">Price (₹)</label><input id="price" type="number" step="0.01" min="0" max="100000000" inputmode="decimal" placeholder="0.00" required></div><div class="field"><label for="qty">Quantity</label><input id="qty" type="number" step="1" min="1" max="9999" inputmode="numeric" value="1" required></div></div>
  <div class="field"><label for="url">Product link (optional)</label><input id="url" type="url" inputmode="url" maxlength="2048" placeholder="https://example.com/product" autocomplete="off"></div>
  <div class="form-error" id="form-error" role="alert"></div>
  <div class="form-bottom"><button type="button" class="secondary" id="cancel">Cancel</button><button type="submit" class="save" id="save">Save item</button></div>
  <button type="button" class="delete" id="delete" hidden>Delete this item</button>
</form></dialog>
<div role="status" class="toast" id="toast"></div>
<script>
(() => {
  'use strict';
  const KEY = 'basket-v1';
  const svgEmpty = `<svg width="35" height="35" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="m3 8 2 12h14l2-12H3Z"/><path d="M8 8V7a4 4 0 1 1 8 0v1"/></svg>`;
  const svgPhoto = `<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8" cy="8" r="1.5"/><path d="m4 19 6-6 4 4 3-3 4 4"/></svg>`;
  const svgPencil = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16 3a2.12 2.12 0 0 1 3 3L7 18l-4 1 1-4Z"/></svg>`;
  const svgCheck = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.9" stroke-linecap="round" stroke-linejoin="round"><path d="m4 12 5 5L20 6"/></svg>`;
  const svgArrow = `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M14 5h5v5M10 14 19 5M19 13v6H5V5h6"/></svg>`;
  const el = (id) => document.getElementById(id);
  const money = (paise) => '₹' + (paise / 100).toLocaleString('en-IN',{minimumFractionDigits:paise%100?2:0,maximumFractionDigits:2});
  const escape = (value) => String(value).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const safeImg = (url) => /^data:image\/(?:jpeg|png|webp);base64,[A-Za-z0-9+/=]+$/.test(url||'');
  const cleanLink = (value) => { const text = (value||'').trim(); if (!text) return ''; try { const u = new URL(text); return u.protocol==='https:'||u.protocol==='http:' ? u.toString():null; } catch { return null; } };
  let items = [];
  let filter = 'all';
  let editingId = null;
  let currentPhoto = '';
  let toastTimeout;
  try { const parsed = JSON.parse(localStorage.getItem(KEY) || '[]'); if (Array.isArray(parsed)) items = parsed.filter(i=>i&&typeof i.id==='string'&&typeof i.name==='string').slice(0,1000); else throw Error('Invalid list'); }
  catch { items=[]; setTimeout(()=>showToast('Could not read saved items.'),100); }
  function showToast(message){ const toast=el('toast');toast.textContent=message;toast.classList.add('visible');clearTimeout(toastTimeout);toastTimeout=setTimeout(()=>toast.classList.remove('visible'),2800); }
  function persist(next){
    try { localStorage.setItem(KEY,JSON.stringify(next));items=next;return true; }
    catch(err){showToast('Storage full. Try removing large photos.');return false;}
  }
  function totalFor(arr){return arr.reduce((a,i)=>a+Math.max(0,Number(i.pricePaise)||0)*Math.max(1,Number(i.qty)||1),0);}
  function render(){
    const total=totalFor(items), left=items.filter(i=>!i.bought), pending=left.length;
    el('total').textContent=money(total);
    el('remaining').textContent=money(totalFor(left));
    el('remaining-count').textContent='· '+pending+' '+(pending===1?'item':'items');
    el('item-count').textContent=items.length+' '+(items.length===1?'item':'items');
    const q=el('search').value.trim().toLowerCase();
    const found=items.filter(i=>(filter==='all'||(filter==='bought'?i.bought:!i.bought))&&i.name.toLowerCase().includes(q)).sort((a,b)=>Number(a.bought)-Number(b.bought) || Number(b.createdAt)-Number(a.createdAt));
    const target=el('items');
    if(!found.length){
      const nothing=items.length===0;
      target.innerHTML=`<div class="empty"><div class="empty-illustration">${svgEmpty}</div><h3 class="empty-title">${nothing?'Your list starts here':'No items found'}</h3><p class="empty-desc">${nothing?'Add your first item with its price, photo, or shopping link.':'Try another search or select a different filter.'}</p></div>`;
      return;
    }
    target.innerHTML=found.map(i=>{
      const thumb = safeImg(i.image) ? `<img alt="" src="${i.image}">` : svgPhoto;
      const count=Math.max(1, Number(i.qty)||1);
      const unit=Math.max(0,Number(i.pricePaise)||0);
      const uri=cleanLink(i.url);
      return `<article class="item ${i.bought?'bought':''}" data-id="${escape(i.id)}"><button class="check ${i.bought?'checked':''}" type="button" data-action="check" data-id="${escape(i.id)}" aria-label="${i.bought?'Mark not purchased':'Mark purchased'}: ${escape(i.name)}" aria-pressed="${!!i.bought}">${i.bought?svgCheck:''}</button><div class="thumb">${thumb}</div><div class="item-info"><div class="item-name">${escape(i.name)}</div><div class="item-sub">${count} × ${money(unit)}</div></div><div class="item-right"><div class="price">${money(unit*count)}</div><div class="right-actions">${uri?`<a href="${escape(uri)}" class="open-link" aria-label="Open shopping link for ${escape(i.name)}" data-action="link">Link ${svgArrow}</a>`:''}<button class="icon-btn" type="button" data-action="edit" data-id="${escape(i.id)}" aria-label="Edit ${escape(i.name)}">${svgPencil}</button></div></div></article>`;
    }).join('');
  }
  function openEditor(id=null){
    const item=id?items.find(i=>i.id===id):null;
    editingId=item?.id||null; currentPhoto=item?.image||'';
    el('item-form').reset();el('form-error').textContent='';
    el('dialog-title').textContent=item?'Edit item':'Add item';el('save').textContent=item?'Save changes':'Save item';el('delete').hidden=!item;
    el('name').value=item?.name||'';
    el('price').value=item ? (item.pricePaise/100).toFixed(2) : '';
    el('qty').value=item?.qty||1;
    el('url').value=item?.url||'';
    updatePhoto();el('dialog').showModal();
    setTimeout(()=>el('name').focus(),150);
  }
  function updatePhoto(){const img=el('photo-preview');img.hidden=!safeImg(currentPhoto);if(!img.hidden)img.src=currentPhoto;else img.removeAttribute('src');el('photo-icon').hidden=!!currentPhoto;el('photo-label').textContent=currentPhoto?'Change photo':'Add photo';}
  function dismissEditor(){const dialog=el('dialog'); if(dialog.open){dialog.close();return true;}return false;}
  window.dismissEditor=dismissEditor;
  function saveItem(event){
    event.preventDefault();
    const name=el('name').value.trim(); const rawPrice=el('price').value.trim();const price=Number(rawPrice); const qty=Number(el('qty').value);const rawUrl=el('url').value;const url=cleanLink(rawUrl);
    let error='';
    if(!name)error='Enter an item name.';
    else if(!rawPrice || !Number.isFinite(price)||price<0||price>100000000||!/^(\d+)(\.\d{1,2})?$/.test(rawPrice)) error='Enter a valid price (up to 2 decimals).';
    else if(!Number.isSafeInteger(qty)||qty<1||qty>9999)error='Quantity must be between 1 and 9,999.';
    else if(rawUrl.trim() && url===null)error='Use a valid http:// or https:// product link.';
    el('form-error').textContent=error;if(error)return;
    const existing=items.find(i=>i.id===editingId);
    const record={id:existing?.id||String(Date.now())+'-'+Math.random().toString(36).slice(2),name,pricePaise:Math.round(price*100),qty,url,image:currentPhoto,bought:existing?.bought||false,createdAt:existing?.createdAt||Date.now()};
    const next=existing?items.map(i=>i.id===existing.id?record:i):[record,...items];
    if(persist(next)){dismissEditor();render();showToast(existing?'Item updated':'Item added to your list');}
  }
  function removeItem(){ const item=items.find(i=>i.id===editingId);if(!item)return;if(!confirm('Delete "'+item.name+'" from your list?'))return;if(persist(items.filter(i=>i.id!==item.id))){dismissEditor();render();showToast('Item deleted');} }
  async function readPhoto(file){
    if(!file)return;
    if(!file.type.startsWith('image/')){el('form-error').textContent='Choose an image file.';return;}
    if(file.size>20*1024*1024){el('form-error').textContent='Choose a photo smaller than 20 MB.';return;}
    try{
      const data=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=reject;reader.readAsDataURL(file);});
      const img=await new Promise((resolve,reject)=>{const i=new Image();i.onload=()=>resolve(i);i.onerror=reject;i.src=data;});
      const scale=Math.min(1,480/Math.max(img.width,img.height));const canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(img.width*scale));canvas.height=Math.max(1,Math.round(img.height*scale));
      const ctx=canvas.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(img,0,0,canvas.width,canvas.height);
      currentPhoto=canvas.toDataURL('image/jpeg',0.7);updatePhoto();el('form-error').textContent='';
    }catch{el('form-error').textContent='Could not read that photo. Try another.';}
    el('photo').value='';
  }
  el('add-btn').addEventListener('click',()=>openEditor());
  el('close-dialog').addEventListener('click',dismissEditor);el('cancel').addEventListener('click',dismissEditor);
  el('dialog').addEventListener('click',(event)=>{if(event.target===el('dialog'))dismissEditor();});
  el('item-form').addEventListener('submit',saveItem);
  el('delete').addEventListener('click',removeItem);
  el('photo').addEventListener('change',(event)=>readPhoto(event.target.files?.[0]));
  el('search').addEventListener('input',render);
  document.querySelectorAll('[data-filter]').forEach(tab=>tab.addEventListener('click',()=>{
    filter=tab.dataset.filter;
    document.querySelectorAll('[data-filter]').forEach(t=>{t.classList.toggle('active',t===tab);t.setAttribute('aria-pressed',String(t===tab));});
    render();
  }));
  el('items').addEventListener('click',(event)=>{
    const btn=event.target.closest('[data-action]');if(!btn||btn.dataset.action==='link')return;
    const id=btn.dataset.id;
    if(btn.dataset.action==='edit')openEditor(id);
    else if(btn.dataset.action==='check'){
      const next=items.map(i=>i.id===id?{...i,bought:!i.bought}:i);
      if(persist(next))render();
    }
  });
  render();
})();
</script>
</body>
</html>
