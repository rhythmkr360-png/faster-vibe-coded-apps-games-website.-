name: Build Basket APK
on:
  push:
    branches:
      - build/basket-apk-20261025
  pull_request:
    branches: [main]
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - run: cd basket-android && gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Basket-debug-APK
          path: basket-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
